name: 更新外部 Skills

on:
  schedule:
    # 每周一北京时间 04:17 运行，避开整点任务高峰。
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    name: 检查并同步更新
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库与子模块
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 获取 pnpm store 路径
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: 缓存 pnpm 依赖
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 更新外部 Skills
        run: pnpm run update

      - name: 校验 Skills
        run: pnpm run check

      - name: 创建更新 PR
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            .gitmodules
            sources
            skills
          branch: automation/update-skills
          delete-branch: true
          commit-message: "chore: 自动更新外部 Skills"
          title: "chore: 自动更新外部 Skills"
          body: |
            定时检查发现外部 Skill 存在更新。

            - 更新 Git submodule 指针
            - 同步发布目录
            - 已运行 `pnpm run check`

            请在合并前检查上游 Skill 的行为变化。

      - name: 开启自动合并
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge \
            "${{ steps.create-pr.outputs.pull-request-number }}" \
            --auto \
            --squash \
            --delete-branch
